<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Metadata -->
    <title>LeadFlow — Enterprise Lead Tracker | Stylework</title>
    <meta
      name="description"
      content="LeadFlow is an enterprise-grade lead management and qualification tracker built for Stylework. Monitor pipeline health, track lead conversions, and manage sales workflows in real time."
    />
    <meta
      name="keywords"
      content="Stylework, LeadFlow, Lead Tracker, CRM, Sales Pipeline, Lead Qualification, Sales Analytics"
    />
    <meta name="author" content="Stylework" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Browser & PWA Customization -->
    <meta name="theme-color" id="theme-color-meta" content="#4f46e5" />
    <meta name="application-name" content="LeadFlow" />
    <meta name="apple-mobile-web-app-title" content="LeadFlow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph Protocol -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stylework LeadFlow" />
    <meta
      property="og:title"
      content="LeadFlow — Enterprise Lead Management & Qualification Tracker"
    />
    <meta
      property="og:description"
      content="Streamline and accelerate your sales pipeline with Stylework LeadFlow. Real-time metrics, status transitions, and instant lead tracking."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="LeadFlow — Enterprise Lead Management & Qualification Tracker"
    />
    <meta
      name="twitter:description"
      content="Streamline and accelerate your sales pipeline with Stylework LeadFlow. Real-time metrics, status transitions, and instant lead tracking."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
